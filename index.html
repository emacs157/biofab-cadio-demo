<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Shareable by link, not discoverable. Flip this when BioFab wants it indexed. -->
<meta name="robots" content="noindex, nofollow">
<title>Cadio — BioFab Innovations</title>
<style>
:root{
  --bg:#0d0f17; --bg-elev:#171c26; --card:#1c212e; --stroke:rgba(255,255,255,.07);
  --t1:#fff; --t2:rgba(255,255,255,.62); --t3:rgba(255,255,255,.38);
  --accent:#4cc7fa; --grid:rgba(255,255,255,.06);
  --ok:#40cc8c; --warn:#fab833; --crit:#f55261;
  --glucose:#4cb3f2; --lactate:#f28c33; --cortisol:#b880f2; --hydration:#33ccbf;
  --cardiac:#f2596b; --heartRate:#fa6b8c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--t1); font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",
  "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:16px}
.hidden{display:none!important}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--t3);text-transform:uppercase}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:16px 24px;border-bottom:1px solid var(--stroke);background:var(--bg-elev);
  position:sticky;top:0;z-index:40;
}
.wordmark{display:flex;align-items:center;gap:10px}
.wordmark svg{color:var(--accent)}
.wordmark h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.wordmark p{font-size:12px;color:var(--t2);font-weight:500}
.eyebrow{display:block;font-size:9.5px;font-weight:800;letter-spacing:.19em;text-transform:uppercase;
  color:var(--accent);margin-bottom:2px}
.pill.sim{background:rgba(250,184,51,.13);color:var(--warn);cursor:help}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--t2);white-space:nowrap;
}
.btn{padding:10px 18px;border-radius:999px;background:var(--card);font-size:13.5px;font-weight:700}
.btn:hover{background:#252b3a}
.btn.primary{background:var(--accent);color:#04121a}
.btn.primary:hover{filter:brightness(1.08)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--t3)}
.seg button.on{background:var(--bg-elev);color:var(--t1)}

/* ---------- layout ---------- */
main{padding:20px 24px 40px;max-width:1680px;margin:0 auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:16px}

/* ---------- pitch ---------- */
.pitch{
  position:relative;aspect-ratio:16/11;border-radius:18px;overflow:hidden;
  border:1px solid var(--stroke);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 9%,transparent 9% 18%),
    radial-gradient(120% 80% at 50% 0%,#16321f 0%,#0e2016 55%,#0a1710 100%);
}
.pitch .lines{position:absolute;inset:0;color:rgba(255,255,255,.13)}
.tok{
  position:absolute;transform:translate(-50%,-50%);width:96px;text-align:center;
  cursor:pointer;transition:transform .15s ease;
}
.tok:hover{transform:translate(-50%,-50%) scale(1.07)}
.shirt{
  width:46px;height:46px;margin:0 auto;border-radius:50%;
  background:var(--bg-elev);color:var(--t2);
  display:grid;place-items:center;font-weight:800;font-size:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;transition:background .3s,color .3s;
}
/* Alert carries a ring as well as red — state must never be colour-only. */
.shirt.crit{box-shadow:0 0 0 3px rgba(255,255,255,.92),0 6px 18px rgba(0,0,0,.45)}
.tok .nm{font-size:11.5px;font-weight:700;margin-top:6px;text-shadow:0 2px 6px #000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .sc{font-size:11px;font-weight:700;color:var(--t2);text-shadow:0 2px 6px #000}

/* ---------- squad table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--t3);font-weight:700;padding:0 10px 10px;border-bottom:1px solid var(--stroke)}
td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.045)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.035)}
.dotrow{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;border-radius:3px}
.tag{padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap}

/* ---------- rail widgets ---------- */
.evt{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;
  background:var(--bg-elev);text-align:left;margin-bottom:8px}
.evt:hover{background:#232a38}
.evt:disabled{opacity:.35;cursor:default}
.evt .k{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--t2);flex:none}
.evt b{display:block;font-size:13px;font-weight:700}
.evt span{display:block;font-size:11px;color:var(--t3);line-height:1.3}
.feedrow{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px}
.feedrow+.feedrow{border-top:1px solid rgba(255,255,255,.05)}
.empty{font-size:12.5px;color:var(--t2)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{background:var(--bg-elev);border-radius:12px;padding:10px 4px}
.tally b{display:block;font-size:22px;font-weight:800;line-height:1.15}
.tally span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:700}
/* One dot per player, so the three counts visibly partition the XI. */
#tallyDots{margin-top:11px;justify-content:space-between}
#tallyDots .dot{width:12px;height:12px}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--t2);
  margin-bottom:14px}
.back:hover{color:var(--t1)}
.detail-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{flex:1;min-width:132px;background:var(--card);border:1px solid var(--stroke);
  border-radius:14px;padding:11px 13px;text-align:left}
.chip.on{border-color:currentColor}
.chip .cn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--t2)}
.chip .cv{font-size:21px;font-weight:800;margin-top:3px}
.chip .cu{font-size:10.5px;color:var(--t3);font-weight:600}
.smalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;margin-top:14px}
.small{background:var(--card);border:1px solid var(--stroke);border-radius:14px;padding:12px;
  text-align:left;width:100%}
.small .sh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--t2)}
.small .sv{margin-left:auto;font-size:13px;font-weight:800}
.ringwrap{display:grid;place-items:center;margin:8px 0 4px}
.legend{display:flex;gap:12px;margin-left:auto;font-size:11px;color:var(--t3)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:2px}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,15,23,.92);
  border-radius:18px;z-index:20}
.stage{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t3);padding:5px 0}
.stage.on{color:var(--t1)}
.stage.done{color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(4,6,10,.72);display:grid;place-items:center;z-index:100;
  backdrop-filter:blur(6px)}
.modal .box{background:var(--card);border:1px solid var(--crit);border-radius:22px;padding:28px;
  max-width:440px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.7)}

/* ---------- platform strip (from the BioFab deck) ---------- */
.platform{margin-top:20px}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.layer{background:var(--bg-elev);border-radius:14px;padding:13px 14px}
.layer b{display:block;font-size:13px;font-weight:800;margin-bottom:3px}
.layer span{font-size:11.5px;color:var(--t2);line-height:1.4}
.layer .ix{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:.1em}

@media(max-width:1100px){
  .split,.detail-grid{grid-template-columns:minmax(0,1fr)}
  main{padding:16px}
  header{padding:14px 16px}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>
    <div>
      <span class="eyebrow">BioFab Innovations</span>
      <h1>Cadio</h1>
      <p data-i18n="subtitle"></p>
    </div>
  </div>
  <div class="spacer"></div>
  <span class="pill sim" title="" data-i18n-title="simFull">
    <span class="dot" style="background:var(--warn);flex:none"></span><span data-i18n="simBadge"></span>
  </span>
  <span class="pill"><span id="monPill"></span></span>
  <button class="btn" id="resetBtn" data-i18n="reset"></button>
  <div class="seg" id="langSeg">
    <button data-lang="en" class="on">EN</button><button data-lang="zh">中文</button>
  </div>
</header>

<main>
  <!-- ============ SQUAD ============ -->
  <section id="squadView">
    <div class="split">
      <div>
        <div class="seg" style="width:max-content;margin-bottom:14px" id="viewSeg">
          <button data-view="pitch" class="on" data-i18n="tabPitch"></button>
          <button data-view="list" data-i18n="tabSquad"></button>
        </div>

        <div id="pitchWrap" class="pitch">
          <svg class="lines" viewBox="0 0 160 110" preserveAspectRatio="none" fill="none"
               stroke="currentColor" stroke-width="0.5">
            <rect x="4" y="4" width="152" height="102"/>
            <line x1="4" y1="55" x2="156" y2="55"/>
            <circle cx="80" cy="55" r="16"/>
            <rect x="47" y="4" width="66" height="20"/><rect x="47" y="86" width="66" height="20"/>
            <rect x="64" y="4" width="32" height="8"/><rect x="64" y="98" width="32" height="8"/>
          </svg>
        </div>

        <div id="listWrap" class="card hidden">
          <table>
            <thead><tr>
              <th style="width:44px">#</th><th data-i18n="colName"></th><th data-i18n="colPos"></th>
              <th data-i18n="colScore"></th><th data-i18n="colPanel"></th><th data-i18n="colHr"></th>
              <th data-i18n="colStatus"></th>
            </tr></thead>
            <tbody id="squadRows"></tbody>
          </table>
        </div>

        <div class="card platform">
          <div class="label" data-i18n="platformTitle"></div>
          <div class="layers" id="layers"></div>
          <p style="font-size:12px;color:var(--t2);margin-top:12px" data-i18n="platformNote"></p>
        </div>

        <footer style="margin-top:20px;padding:0 4px;font-size:11.5px;color:var(--t3);line-height:1.6">
          <div style="color:var(--t2);font-weight:600" data-i18n="footerCo"></div>
          <div data-i18n="footerTag"></div>
          <div style="margin-top:8px;color:var(--warn)" data-i18n="simFull"></div>
        </footer>
      </div>

      <div class="rail">
        <div class="card">
          <div class="label" style="margin-bottom:10px" data-i18n="squadState"></div>
          <div class="tally">
            <div><b id="tallyOk" style="color:var(--ok)">–</b><span data-i18n="ready"></span></div>
            <div><b id="tallyWarn" style="color:var(--warn)">–</b><span data-i18n="watch"></span></div>
            <div><b id="tallyCrit" style="color:var(--crit)">–</b><span data-i18n="alert"></span></div>
          </div>
          <div class="dotrow" id="tallyDots"></div>
        </div>

        <div class="card">
          <div class="label" style="margin-bottom:10px" data-i18n="sessionEvents"></div>
          <div id="events"></div>
          <button class="evt" id="autoBtn" style="margin-bottom:0">
            <span class="k">A</span><span><b data-i18n="autoTitle"></b><span data-i18n="autoSub"></span></span>
          </button>
        </div>

        <div class="card">
          <div class="label" style="margin-bottom:8px" data-i18n="alertFeed"></div>
          <div id="squadFeed"><p class="empty" data-i18n="noAlerts"></p></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ DETAIL ============ -->
  <section id="detailView" class="hidden">
    <button class="back" id="backBtn">← <span data-i18n="backToSquad"></span></button>
    <div class="detail-grid">
      <div class="rail">
        <div class="card">
          <div style="display:flex;align-items:flex-start">
            <div>
              <div style="font-size:18px;font-weight:800" id="dName"></div>
              <div style="font-size:12.5px;color:var(--t2)" id="dMeta"></div>
            </div>
            <span class="pill" style="margin-left:auto;padding:5px 11px" id="dLive"></span>
          </div>
          <div class="ringwrap"><svg id="dRing" width="150" height="150" viewBox="0 0 150 150"></svg></div>
          <div style="text-align:center;font-size:12.5px;font-weight:700;color:var(--t2)"
               data-i18n="recoveryReadiness"></div>
        </div>
        <div class="card">
          <div class="label" style="margin-bottom:9px" data-i18n="loadDrivers"></div>
          <div id="dDrivers"></div>
        </div>
        <div class="card">
          <div class="label" style="margin-bottom:8px" data-i18n="alertFeed"></div>
          <div id="dFeed"></div>
        </div>
      </div>

      <div style="position:relative">
        <div id="dBody">
          <div class="chips" id="dChips"></div>
          <div class="card">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
              <span style="font-size:16px;font-weight:800" id="dBigName"></span>
              <div class="legend">
                <span><i style="background:currentColor;opacity:.3" id="lgBand"></i>
                  <span data-i18n="normalBand"></span></span>
                <span><i style="background:var(--warn)"></i><span data-i18n="warning"></span></span>
                <span><i style="background:var(--crit)"></i><span data-i18n="critical"></span></span>
              </div>
            </div>
            <svg id="dBigChart" viewBox="0 0 720 260" preserveAspectRatio="none"
                 style="width:100%;height:260px"></svg>
          </div>
          <div class="smalls" id="dSmalls"></div>
        </div>
        <div class="overlay hidden" id="dOverlay">
          <div style="text-align:center;max-width:330px">
            <div style="font-size:15px;font-weight:800;margin-bottom:4px" id="ovTitle"></div>
            <div style="font-size:12.5px;color:var(--t2);margin-bottom:18px" id="ovDetail"></div>
            <div style="text-align:left;display:inline-block" id="ovStages"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal hidden" id="alertModal">
  <div class="box">
    <div style="font-size:42px;line-height:1">⚠️</div>
    <div style="font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--crit);margin:10px 0 6px"
         data-i18n="criticalAlert"></div>
    <div style="font-size:20px;font-weight:800" id="mkName"></div>
    <div class="mono" style="font-size:34px;font-weight:800;color:var(--crit);margin:8px 0">
      <span id="mkValue"></span><span style="font-size:15px;color:var(--t2)" id="mkUnit"></span>
    </div>
    <p style="font-size:13.5px;color:var(--t2);line-height:1.5" id="mkMsg"></p>
    <button class="btn primary" style="margin-top:20px" id="mkDismiss" data-i18n="acknowledge"></button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   i18n — the deck is Chinese, the app is British English.
   ============================================================ */
const STR = {
  en:{
    subtitle:"Northgate FC · First Team · Training Session",
    simBadge:"Simulated data",
    simFull:"Simulated training session — demonstration data. No hardware, no network, no live patient or athlete readings.",
    footerCo:"BioFab Innovations Ltd · Cambridge, UK",
    footerTag:"Measure biosignals, make them computable.",
    monitored:n=>`${n} patches monitored`, reset:"Restart session",
    tabPitch:"Formation", tabSquad:"Squad",
    colName:"Player", colPos:"Position", colScore:"Recovery", colPanel:"Panel", colHr:"HR",
    colStatus:"Status",
    squadState:"Squad state", ready:"Ready", watch:"Watch", alert:"Alert",
    sessionEvents:"Session events", alertFeed:"Alerts", noAlerts:"No alerts this session",
    autoTitle:"Autoplay", autoSub:"Runs the whole scripted session unattended",
    backToSquad:"Back to squad", recoveryReadiness:"Recovery Readiness",
    loadDrivers:"Load drivers", allInRange:"All markers within range",
    normalBand:"Normal band", warning:"Warning", critical:"Critical",
    criticalAlert:"CRITICAL ALERT", acknowledge:"Acknowledge",
    live:"LIVE", awaiting:"Awaiting stream…",
    connecting:["Connecting to patch","Pairing with the microneedle array over BLE."],
    baselining:["Establishing baseline","Reading resting interstitial fluid before the session starts."],
    ready2:["Live","Streaming."],
    stages:["Patch detected","Baseline captured","Streaming live"],
    bands:{Ready:"Ready",Moderate:"Moderate",Compromised:"Compromised"},
    statuses:{normal:"Normal",warning:"Watch",critical:"Alert"},
    platformTitle:"The BioFab platform underneath",
    platformNote:"One platform, many applications — what changes between them is the chemistry, not the hardware.",
    layers:[["01","Microneedles","Painless access to interstitial fluid — no blood draw"],
            ["02","Sensing chemistry","Decides which molecule is recognised"],
            ["03","Electrochemistry","Turns molecular recognition into an electrical signal"],
            ["04","AI","Turns a series of discrete points into a trajectory"]]
  },
  zh:{
    subtitle:"Northgate 足球俱乐部 · 一队 · 训练课",
    simBadge:"模拟数据",
    simFull:"模拟训练课——演示数据。无硬件、无网络，非真实患者或运动员读数。",
    footerCo:"BioFab Innovations Ltd · 英国剑桥",
    footerTag:"测量生物信号，让它可被计算。",
    monitored:n=>`${n} 个贴片在测`, reset:"重新开始",
    tabPitch:"阵型", tabSquad:"球员列表",
    colName:"球员", colPos:"位置", colScore:"恢复度", colPanel:"标志物", colHr:"心率",
    colStatus:"状态",
    squadState:"全队状态", ready:"良好", watch:"关注", alert:"警报",
    sessionEvents:"训练事件", alertFeed:"警报", noAlerts:"本次训练暂无警报",
    autoTitle:"自动演示", autoSub:"无人值守，自动跑完整段脚本",
    backToSquad:"返回球队", recoveryReadiness:"恢复就绪度",
    loadDrivers:"负荷来源", allInRange:"所有标志物均在范围内",
    normalBand:"正常区间", warning:"警戒", critical:"危急",
    criticalAlert:"危急警报", acknowledge:"知道了",
    live:"实时", awaiting:"等待数据…",
    connecting:["正在连接贴片","通过蓝牙与微针阵列配对。"],
    baselining:["正在建立基线","在训练开始前读取静息状态下的组织液。"],
    ready2:["实时","数据传输中。"],
    stages:["已识别贴片","已采集基线","实时传输中"],
    bands:{Ready:"良好",Moderate:"中等",Compromised:"受损"},
    statuses:{normal:"正常",warning:"关注",critical:"警报"},
    platformTitle:"BioFab 底层平台",
    platformNote:"一个平台，多种应用——应用之间的差别在化学，而不在硬件。",
    layers:[["01","微针","无痛获取组织液——无需抽血"],
            ["02","传感化学","决定识别哪一种分子"],
            ["03","电化学","把分子识别转换为电信号"],
            ["04","人工智能","把一系列离散的点变成一条轨迹"]]
  }
};
let LANG = "en";
const T = () => STR[LANG];

/* ============================================================
   Biomarkers — ported from Cadio/Models/Biomarker.swift
   ============================================================ */
const M = {
  glucose:  {name:{en:"Glucose",en_full:"Blood Glucose",zh:"血糖",zh_full:"血糖"},
             unit:"mmol/L", precision:1, tint:"--glucose",
             normal:[4.0,7.0], warn:[3.5,"low"], crit:[3.0,"low"], domain:[2.0,12.0]},
  lactate:  {name:{en:"Lactate",en_full:"Blood Lactate",zh:"乳酸",zh_full:"血乳酸"},
             unit:"mmol/L", precision:1, tint:"--lactate",
             normal:[0.5,2.0], warn:[4.0,"high"], crit:[8.0,"high"], domain:[0,14]},
  cortisol: {name:{en:"Cortisol",en_full:"Salivary Cortisol",zh:"皮质醇",zh_full:"皮质醇"},

/* ============================================================
   Kinetics — ported from Cadio/Simulation/Physiology.swift.
   Two-stage lag: the value chases a moving target, the target
   relaxes back to baseline. That is what makes the curves look
   physiological instead of stepping instantly.
   ============================================================ */
const TAU = {
  heartRate:{r:4,  f:12,  x:25,   n:1.4},
  lactate:  {r:45, f:150, x:220,  n:0.05},
  cortisol: {r:90, f:300, x:400,  n:4},
  glucose:  {r:40, f:80,  x:160,  n:0.04},
  hydration:{r:40, f:28,  x:9999, n:0.12},   // does not self-recover without fluids
  cardiac:  {r:26, f:600, x:9999, n:0.15}
};

// mulberry32 — deterministic run-to-run, so every rehearsal looks the same.
function rng(seed){
  let s = seed >>> 0;
  const u = () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  return { gauss(){ const a=Math.max(u(),1e-12); return Math.sqrt(-2*Math.log(a))*Math.cos(2*Math.PI*u()); } };
}

function makeKinetics(k, baseline, cond){
  const fit = 0.85 + (1-cond)*0.4;           // fitter athletes clear load faster
  const t = TAU[k];
  return {value:baseline, target:baseline, baseline,
          tr:t.r, tf:t.f*fit, tx:t.x*fit, noise:t.n};
}
function stepKinetics(s, dt, r){
  s.target += (s.baseline - s.target) * (1 - Math.exp(-dt/s.tx));
  const tau = s.target >= s.value ? s.tr : s.tf;
  s.value  += (s.target - s.value) * (1 - Math.exp(-dt/tau));
  s.value  += r.gauss() * s.noise * Math.sqrt(dt);
  s.value   = Math.max(0, s.value);
}

/* ============================================================
   Recovery score — ported from Cadio/Simulation/RecoveryScore.swift.
   A demo heuristic, not a validated clinical index.
   ============================================================ */
const WEIGHT = {cardiac:45,hydration:20,lactate:18,cortisol:14,glucose:12,heartRate:10};
function strain(k,v){
  const [lo,hi] = M[k].normal;
  if(k==="hydration"||k==="glucose"){
    if(v>=lo) return 0;
    return Math.min(1,(lo-v)/Math.max(.1, lo-M[k].crit[0]));
  }
  if(v<=hi) return 0;
  return Math.min(1,(v-hi)/Math.max(.1, M[k].crit[0]-hi));
}
function recovery(latest){
  let total=0, contributions=[];
  for(const k of ALL){
    const v = latest[k]; if(v==null) continue;
    const p = strain(k,v)*WEIGHT[k];
    if(p>0.5) contributions.push({k,p});
    total += p;
  }
  contributions.sort((a,b)=>b.p-a.p);
  return {score:Math.max(0,Math.min(100,Math.round(100-total))), contributions};
}
const band = s => s>=80 ? {key:"Ready",st:"normal"} : s>=60 ? {key:"Moderate",st:"warning"}
                                                            : {key:"Compromised",st:"critical"};

/* ============================================================
   Engine — one source per athlete, phases, alerts, autoplay.
   ============================================================ */
const TICK = 500, TIME_SCALE = 2.0, WINDOW = 15*60;  // sim-seconds of history kept

const S = ROSTER.map(a => ({
  athlete:a, phase:"idle", clock:0, deadline:null,
  rng:rng(42 + a.num),
  kin:Object.fromEntries(ALL.map(k => [k, makeKinetics(k, a.b[k], a.cond)])),
  series:Object.fromEntries(ALL.map(k => [k, []])),
  latest:{}, score:100, contributions:[], alerts:[], lastSeverity:{}
}));

const engine = {
  running:false, focus:0, autoplay:false, autoStart:0, autoStep:0, timer:null,
  route:"squad", selected:"lactate", activeAlert:null
};

function connect(s){ if(s.phase!=="idle") return; s.phase="connecting"; s.deadline=s.clock+3; }

function applyEvent(s, ev){
  if(s.phase!=="live") return;
  if(!ev.drive){ for(const k of ALL) s.kin[k].target = s.athlete.b[k]; return; }
  for(const [k,v] of Object.entries(ev.drive)) s.kin[k].target = v;
}

function tick(s){
  const dt = (TICK/1000)*TIME_SCALE;
  s.clock += dt;
  if(s.phase==="idle") return;
  if(s.phase==="connecting"){
    if(s.clock>=s.deadline){ s.phase="baselining"; s.deadline=s.clock+3; }
    return;
  }
  if(s.phase==="baselining"){
    if(s.clock>=s.deadline){
      s.phase="live"; s.deadline=null;
      // Everyone but the athlete on screen picks up ambient training load, so the
      // squad view is populated the moment the patches come online.
      if(s.athlete.id!==engine.focus) applyEvent(s, EVENTS[0]);
    } else return;
  }
  for(const k of ALL) stepKinetics(s.kin[k], dt, s.rng);

  for(const k of ALL){
    const v = s.kin[k].value;
    s.latest[k] = v;
    const arr = s.series[k];
    arr.push({t:s.clock, v});
    const cut = s.clock - WINDOW;
    while(arr.length && arr[0].t < cut) arr.shift();
  }

  const r = recovery(s.latest);
  s.score = r.score; s.contributions = r.contributions;

  for(const k of ALL){
    const now = statusOf(k, s.latest[k]);
    const prev = s.lastSeverity[k] || "normal";
    if(now==="critical" && prev!=="critical"){
      const a = {k, value:s.latest[k], t:s.clock};
      s.alerts.unshift(a);
      if(s.athlete.id===engine.focus && !engine.activeAlert) showAlert(a);
    }
    s.lastSeverity[k] = now;
  }
}

function startSession(focusId){
  engine.focus = focusId; engine.running = true;
  S.forEach(connect);
  if(!engine.timer) engine.timer = setInterval(loop, TICK);
  render();
}

// The session is always live — reset means start it over, not stop it.
function resetAll(){
  clearInterval(engine.timer); engine.timer=null;
  engine.running=false; engine.autoplay=false; engine.activeAlert=null;
  S.forEach((s,i) => {
    s.phase="idle"; s.clock=0; s.deadline=null; s.rng=rng(42+s.athlete.num);
    s.kin=Object.fromEntries(ALL.map(k=>[k,makeKinetics(k,s.athlete.b[k],s.athlete.cond)]));
    s.series=Object.fromEntries(ALL.map(k=>[k,[]]));
    s.latest={}; s.score=100; s.contributions=[]; s.alerts=[]; s.lastSeverity={};
  });
  document.getElementById("alertModal").classList.add("hidden");
  startSession(engine.focus);
}

// Scripted beats, paced for an unattended run (matches SimulationEngine.startAutoPlay).
const SCRIPT = [[2,0],[12,1],[22,2],[32,3],[62,4]];
function toggleAutoplay(){
  if(engine.autoplay){ engine.autoplay=false; return; }
  engine.autoplay=true; engine.autoStart=Date.now(); engine.autoStep=0;
}

function loop(){
  S.forEach(tick);
  if(engine.autoplay){
    const el = (Date.now()-engine.autoStart)/1000;
    while(engine.autoStep<SCRIPT.length && el>=SCRIPT[engine.autoStep][0]){
      applyEvent(S[engine.focus], EVENTS[SCRIPT[engine.autoStep][1]]);
      engine.autoStep++;
    }
    if(engine.autoStep>=SCRIPT.length) engine.autoplay=false;
  }
  render();
}

const worst = s => PANEL.reduce((w,k)=>{
  const st=statusOf(k,s.latest[k]); return RANK[st]>RANK[w]?st:w; },"normal");

// One state per athlete: the worse of "a marker is out of range" and "readiness
// has dropped". The tally, the pitch circle and the squad tag all read this one,
// so the three counts always partition the XI the same way the pitch shows it.
const state = s => { const w = worst(s), b = band(s.score).st; return RANK[w]>=RANK[b] ? w : b; };

// "live" is not the same as "has data": between going live and the first frame,
// score is still its 100 initialiser. Showing that as "Ready" invents a reading.
const streaming = s => s.phase==="live" && s.latest.heartRate != null;

/* ============================================================
   Charts — inline SVG. Normal band, threshold rules, curve,
   gradient fill, live end cap.
   ============================================================ */
function chart(svg, k, data, {compact=false}={}){
  const W = compact?280:720, H = compact?90:260;
  const padL = compact?4:38, padR = compact?4:44, padT = 6, padB = compact?4:20;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const c = tint(k), [dlo,dhi] = M[k].domain;
  const Y = v => padT + (H-padT-padB) * (1 - (Math.max(dlo,Math.min(dhi,v))-dlo)/(dhi-dlo));

  // Never narrower than 30 sim-seconds — a zero-width domain squeezes the curve
  // against the axis at exactly the "it came alive" moment.
  const last = data[data.length-1];
  const t1 = last ? last.t : 0, t0 = data.length ? data[0].t : t1-30;
  const span = Math.max(30, t1-t0);
  const X = t => padL + (W-padL-padR) * ((t-t0)/span);

  const uid = "g"+k+(compact?"c":"b");
  const parts = [
    `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${c}" stop-opacity=".22"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0"/></linearGradient>
      <clipPath id="${uid}c"><rect x="${padL}" y="${padT}" width="${W-padL-padR}"
        height="${H-padT-padB}"/></clipPath></defs>`,
    `<rect x="${padL}" y="${Y(M[k].normal[1])}" width="${W-padL-padR}"
       height="${Math.abs(Y(M[k].normal[0])-Y(M[k].normal[1]))}" fill="${c}" opacity=".10"/>`,
    `<line x1="${padL}" x2="${W-padR}" y1="${Y(M[k].warn[0])}" y2="${Y(M[k].warn[0])}"
       stroke="var(--warn)" stroke-opacity=".5" stroke-dasharray="4 4"/>`,
    `<line x1="${padL}" x2="${W-padR}" y1="${Y(M[k].crit[0])}" y2="${Y(M[k].crit[0])}"
       stroke="var(--crit)" stroke-opacity=".55" stroke-dasharray="4 4"/>`
  ];

  if(!compact){
    for(let i=0;i<=3;i++){
      const v = dlo + (dhi-dlo)*i/3, y = Y(v);
      parts.push(`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`);
      parts.push(`<text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="10"
        fill="var(--t3)">${v.toFixed(M[k].precision)}</text>`);
    }
  }

  if(data.length>1){
    const pts = data.map(d=>`${X(d.t).toFixed(1)},${Y(d.v).toFixed(1)}`).join(" ");
    const y0 = H-padB;
    parts.push(`<g clip-path="url(#${uid}c)">
      <polygon points="${X(data[0].t).toFixed(1)},${y0} ${pts} ${X(t1).toFixed(1)},${y0}"
        fill="url(#${uid})"/>
      <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${compact?2:2.6}"
        stroke-linejoin="round" stroke-linecap="round"/></g>`);
    const st = statusOf(k,last.v), col = st==="normal" ? c : `var(--${st==="warning"?"warn":"crit"})`;
    parts.push(`<circle cx="${X(t1).toFixed(1)}" cy="${Y(last.v).toFixed(1)}"
      r="${compact?3:5}" fill="${col}"/>`);
    if(!compact) parts.push(`<text x="${X(t1)+9}" y="${Y(last.v)+4}" font-size="12"
      font-weight="700" fill="${col}">${fmt(k,last.v)}</text>`);
  } else {
    parts.push(`<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="11"
      fill="var(--t3)">${T().awaiting}</text>`);
  }
  svg.innerHTML = parts.join("");
}

function ringSvg(score, d=150){
  const r = d/2-9, C = 2*Math.PI*r, b = band(score);
  return `<circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)"
     stroke-width="10"/>
    <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="${SC[b.st]}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}"
      transform="rotate(-90 ${d/2} ${d/2})" style="transition:stroke-dashoffset .4s"/>
    <text x="${d/2}" y="${d/2+4}" text-anchor="middle" font-size="${d*.28}" font-weight="800"
      fill="var(--t1)">${score}</text>
    <text x="${d/2}" y="${d/2+d*.19}" text-anchor="middle" font-size="${d*.082}" font-weight="700"
      fill="var(--t2)">${T().bands[b.key]}</text>`;
}

    `<div class="stage" data-stage="${i}"><span class="tick">○</span>${s}</div>`).join("");
}

function render(){
  $("autoBtn").querySelector("b").textContent =
    T().autoTitle + (engine.autoplay ? " ⏹" : "");

  const tally = {normal:0,warning:0,critical:0};
  S.filter(streaming).forEach(s => tally[state(s)]++);
  $("tallyOk").textContent = tally.normal;
  $("tallyWarn").textContent = tally.warning;
  $("tallyCrit").textContent = tally.critical;
  $("tallyDots").innerHTML = S.map(s =>
    `<span class="dot" title="${pName(s.athlete)}"
       style="background:${streaming(s) ? SC[state(s)] : ""}"></span>`).join("");

  // ---- pitch tokens: the circle itself is the state — green ready, amber watch,
  // red (plus a ring) alert. The shirt number stays inside it for identity.
  $("pitchWrap").querySelectorAll(".tok").forEach(t => {
    const s = S[+t.dataset.pid], st = state(s), b = band(s.score), on = streaming(s);
    const shirt = t.querySelector(".shirt");
    shirt.style.background = on ? SC[st] : "";
    shirt.style.color = on ? "#08121a" : "";
    shirt.classList.toggle("crit", on && st==="critical");
    // Readiness stays neutral here: the circle is the state signal, and a green
    // score under an amber circle just reads as a contradiction from a distance.
    t.querySelector(".sc").textContent = on ? s.score : "";
  });

  // ---- squad table
  $("squadRows").querySelectorAll("tr").forEach(tr => {
    const s = S[+tr.dataset.pid], w = worst(s), b = band(s.score), on = streaming(s);
    tr.querySelector(".sc").textContent = on ? s.score : "–";
    const bar = tr.querySelector(".bar i");
    bar.style.width = (on?s.score:100)+"%";
    bar.style.background = on ? SC[b.st] : "rgba(255,255,255,.15)";
    tr.querySelectorAll(".dot").forEach((d,i) => {
      const st = statusOf(PANEL[i], s.latest[PANEL[i]]);
      d.style.background = st==="normal" ? "rgba(255,255,255,.12)" : SC[st];
    });
    tr.querySelector(".hr").textContent = on ? fmt("heartRate",s.latest.heartRate) : "—";
    // The word follows whichever of the two drove the colour, so they never disagree.
    const tag = tr.querySelector(".tag"), st = state(s);
    tag.textContent = on ? (st!=="normal" && RANK[w]>=RANK[b.st] ? T().statuses[w]
                                                                : T().bands[b.key]) : "–";
    tag.style.color = on ? SC[st] : "var(--t3)";
    tag.style.background = on ? `color-mix(in srgb, ${SC[st]} 18%, transparent)` : "transparent";
  });

  $("events").querySelectorAll(".evt").forEach(b =>
    b.disabled = S[engine.focus].phase !== "live");

  renderFeed($("squadFeed"), S.flatMap(s => s.alerts.map(a=>({...a, who:s.athlete})))
    .sort((x,y)=>y.t-x.t).slice(0,6), true);

  if(engine.route==="detail") renderDetail();
}

function renderFeed(node, alerts, showWho){
  if(!alerts.length){ node.innerHTML = `<p class="empty">${T().noAlerts}</p>`; return; }
  node.innerHTML = alerts.map(a => `<div class="feedrow">
    <span class="dot" style="background:var(--crit);flex:none"></span>
    <span style="font-weight:700">${showWho ? pName(a.who) : mName(a.k)}</span>
    ${showWho ? `<span style="color:var(--t3);font-size:11.5px">${mName(a.k)}</span>` : ""}
    <span class="mono" style="margin-left:auto;color:var(--crit);font-weight:700">
      ${fmt(a.k,a.value)} ${M[a.k].unit}</span></div>`).join("");
}

function renderDetail(){
  const s = S[engine.focus], a = s.athlete, live = s.phase==="live", k = engine.selected;

  $("dName").textContent = pName(a);
  $("dMeta").textContent = `#${a.num} · ${pPos(a)}`;
  $("dLive").innerHTML = `<span class="dot" style="background:${live?"var(--ok)":"var(--t3)"}"></span>
    <span style="color:${live?"var(--ok)":"var(--t3)"};font-weight:800;font-size:11px">
    ${live?T().live:"…"}</span>`;
  $("dRing").innerHTML = ringSvg(s.score);

  $("dDrivers").innerHTML = s.contributions.length
    ? s.contributions.slice(0,4).map(c => `<div class="feedrow">
        <span class="dot" style="background:${tint(c.k)};flex:none"></span>
        <span style="font-weight:600">${mName(c.k)}</span>
        <span class="mono" style="margin-left:auto;color:var(--warn);font-weight:800">
          −${Math.round(c.p)}</span></div>`).join("")
    : `<p class="empty">${T().allInRange}</p>`;
  renderFeed($("dFeed"), s.alerts.slice(0,4), false);

  $("dChips").querySelectorAll(".chip").forEach(c => {
    const ck = c.dataset.k, v = s.latest[ck], st = statusOf(ck,v);
    c.classList.toggle("on", ck===k);
    c.querySelector(".chipname").textContent = mName(ck);
    const cv = c.querySelector(".cv");
    cv.textContent = fmt(ck,v);
    cv.style.color = st==="normal" ? "var(--t1)" : SC[st];
    c.querySelector(".cu").textContent = M[ck].unit;
  });

  $("dBigName").textContent = mFull(k);
  $("lgBand").style.color = tint(k);
  chart($("dBigChart"), k, s.series[k]);

  $("dSmalls").querySelectorAll(".small").forEach(n => {
    const sk = n.dataset.k, v = s.latest[sk], st = statusOf(sk,v);
    n.style.display = (sk!=="heartRate" && sk===k) ? "none" : "";
    n.querySelector(".sname").textContent = mName(sk);
    const sv = n.querySelector(".sv");
    sv.textContent = fmt(sk,v);
    sv.style.color = st==="normal" ? "var(--t1)" : SC[st];
    chart(n.querySelector("svg"), sk, s.series[sk], {compact:true});
  });

  // Connection handshake overlay.
  const ov = $("dOverlay");
  ov.classList.toggle("hidden", live);
  $("dBody").style.opacity = live ? 1 : .12;
  if(!live){
    const key = s.phase==="baselining" ? "baselining" : "connecting";
    $("ovTitle").textContent = T()[key][0];
    $("ovDetail").textContent = T()[key][1];
    const idx = s.phase==="connecting" ? 0 : s.phase==="baselining" ? 1 : 2;
    $("ovStages").querySelectorAll(".stage").forEach((n,i) => {
      n.className = "stage" + (i<idx ? " done" : i===idx ? " on" : "");
      n.querySelector(".tick").textContent = i<idx ? "●" : i===idx ? "◐" : "○";
    });
  }
}

function showAlert(a){
  engine.activeAlert = a;
  $("mkName").textContent = mFull(a.k);
  $("mkValue").textContent = fmt(a.k,a.value);
  $("mkUnit").textContent = " "+M[a.k].unit;
  $("mkMsg").textContent = ALERT_MSG[a.k][LANG];
  $("alertModal").classList.remove("hidden");
}

/* ============================================================
   Routing + input
   ============================================================ */
function openDetail(id){
  engine.focus = id; engine.route = "detail";
  if(S[id].phase==="idle") connect(S[id]);
  $("squadView").classList.add("hidden");
  $("detailView").classList.remove("hidden");
  window.scrollTo(0,0);
  render();
}
function openSquad(){
  engine.route = "squad";
  $("detailView").classList.add("hidden");
  $("squadView").classList.remove("hidden");
  render();
}

$("resetBtn").onclick = resetAll;
$("backBtn").onclick = openSquad;
$("autoBtn").onclick = toggleAutoplay;
$("mkDismiss").onclick = () => { engine.activeAlert=null; $("alertModal").classList.add("hidden"); };

$("viewSeg").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  $("viewSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  $("pitchWrap").classList.toggle("hidden", b.dataset.view!=="pitch");
  $("listWrap").classList.toggle("hidden", b.dataset.view!=="list");
};
$("langSeg").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  LANG = b.dataset.lang;
  $("langSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
  buildStatic(); render();
};

document.addEventListener("keydown", e => {
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==="escape"){ engine.activeAlert=null; $("alertModal").classList.add("hidden");
                    if(engine.route==="detail") openSquad(); return; }
  if(k===" "){ e.preventDefault(); resetAll(); return; }
  if(k==="a"){ toggleAutoplay(); return; }
  const ev = EVENTS.find(v => v.key.toLowerCase()===k);
  if(ev){ e.preventDefault(); applyEvent(S[engine.focus], ev); render(); }
});

buildStatic();
startSession(0);      // the session is live the moment the page opens
</script>
</body>
</html>
